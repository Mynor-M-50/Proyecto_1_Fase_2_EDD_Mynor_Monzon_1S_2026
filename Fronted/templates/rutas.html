<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rutas entre Sucursales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">← Volver al Sistema</a>
        <span class="navbar-text">Mapa de Red Nacional</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <!-- Panel Izquierdo: Selección de Ruta -->
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white"><strong>Calcular Ruta Óptima</strong></div>
                <div class="card-body">
                    <form action="/rutas" method="GET">
                        <div class="mb-3">
                            <label class="form-label">Origen</label>
                            <select name="origen" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for id, s in sucursales.items() %}
                                <option value="{{ id }}" {% if origen == id %}selected{% endif %}>{{ id }} - {{ s.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Destino</label>
                            <select name="destino" class="form-select" required>
                                <option value="">Seleccione...</option>
                                {% for id, s in sucursales.items() %}
                                <option value="{{ id }}" {% if destino == id %}selected{% endif %}>{{ id }} - {{ s.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Algoritmo</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="algoritmo" value="dijkstra" id="d" {% if algoritmo != 'floyd' %}checked{% endif %}>
                                <label class="form-check-label" for="d">Dijkstra (Tiempo/Costo)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="algoritmo" value="floyd" id="f" {% if algoritmo =='floyd' %}checked{% endif %}>
                                <label class="form-check-label" for="f">Floyd-Warshall</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Calcular Ruta</button>
                    </form>
                </div>
            </div>

            {% if ruta_resultado %}
            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white"><strong>Ruta Encontrada</strong></div>
                <div class="card-body">
                    <div class="list-group list-group-flush">
                        {% for s in ruta_resultado %}
                        <div class="list-group-item bg-transparent">
                            <i class="bi bi-geo-alt-fill text-danger"></i>
                            {{ s.id }} - {{ s.nombre }}
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            {% endif %}
        </div>

        <!-- Panel Derecho: Visualización del Grafo -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><strong>Visualización de la Red</strong></div>
                <div class="card-body text-center">
                    {% if grafo_img %}
                        <img src="{{ url_for('static', filename='grafo_sucursales.png') }}?v={{ range(1,9999)|random }}" class="img-fluid rounded border" alt="Grafo de sucursales">
                    {% else %}
                        <div class="py-5 text-muted"> <i class="bi bi-map" style="font-size: 3rem;"></i> <p>Cargue datos para visualizar el grafo.</p> </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
